name: Reusable - Package Standards

on:
  workflow_call:
    inputs:
      app-id-var-name:
        description: >
          Name of the calling repo's vars.* entry holding the GitHub App ID
          used to check out this (private) repo. Defaults to CLA_BOT_APP_ID,
          the app already installed org-wide.
        type: string
        default: CLA_BOT_APP_ID
    secrets:
      app-private-key:
        description: Private key for the GitHub App used to check out this repo.
        required: true

jobs:
  package-standards:
    name: Package standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Generate token to check out pr-quality-checks
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars[inputs.app-id-var-name] }}
          private-key: ${{ secrets.app-private-key }}
          repositories: pr-quality-checks

      - name: Checkout pr-quality-checks
        uses: actions/checkout@v4
        with:
          repository: azmara-labs/pr-quality-checks
          token: ${{ steps.app-token.outputs.token }}
          path: .pr-quality-checks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run standards checks
        run: node .pr-quality-checks/scripts/run-all.mjs .
